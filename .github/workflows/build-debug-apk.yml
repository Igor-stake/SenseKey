name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - prealpha-hardcoded-completion
      - prealpha-accessibility-context
      - prealpha-context-fixes

concurrency:
  group: sensekey-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-runtime:
    name: Completion filter on Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install DEX compiler
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35"'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run production filter in Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android-smoke/run.py

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      # A fresh runner otherwise generates a different signing key on every build.
      # Current runner tools create it under ~/.config/.android, not ~/.android.
      # Preserve both locations so later APKs can update the installed app.
      # This is a pre-alpha convenience: cache eviction still requires a reinstall.
      # A persistent development signing key is needed for durable distribution.
      - name: Cache development signing key
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.config/.android/debug.keystore
          key: sensekey-debug-keystore-v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test context capture and local completions
        run: ./gradlew :app:testRunTestsUnitTest --tests 'helium314.keyboard.latin.context.*' --tests 'helium314.keyboard.latin.completion.*' --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SenseKey-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
